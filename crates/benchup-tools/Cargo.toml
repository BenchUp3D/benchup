[package]
name = "benchup-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared agent operations for BenchUp: tool definitions, executor and project files"

[dependencies]
benchup-core = { path = "../benchup-core" }
