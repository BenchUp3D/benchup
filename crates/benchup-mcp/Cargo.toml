[package]
name = "benchup-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MCP server that lets an AI agent edit a BenchUp project file or the running BenchUp app"

[lib]
name = "benchup_mcp"
path = "src/lib.rs"

[[bin]]
name = "benchup-mcp"
path = "src/main.rs"

[dependencies]
benchup-core = { path = "../benchup-core" }
benchup-tools = { path = "../benchup-tools" }
serde_json.workspace = true
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"
