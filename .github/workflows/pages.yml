name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ['Build releases']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TRUNK_VERSION: '0.22.0'
  TRUNK_SHA256: 'f78c1989240c56592d8cfc4df5cc27399a3ff66a3f9cc819e16f1e3d809ce7c2'

jobs:
  build:
    name: Package website and browser app
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run defaults to the default branch; use the release commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Install Node.js for browser input tests
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Test browser 3D Mouse connection
        run: node --test scripts/test_space_mouse_web.mjs

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Download browser app from the completed release run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: benchup-wasm
          path: dist/release-wasm
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract released browser app
        if: github.event_name == 'workflow_run'
        run: python3 -m zipfile -e dist/release-wasm/benchup-v*-wasm.zip dist/site/play

      - name: Install Rust and WebAssembly target
        if: github.event_name == 'workflow_dispatch'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        if: github.event_name == 'workflow_dispatch'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-wasm
          save-if: 'false'

      - name: Install pinned prebuilt Trunk
        if: github.event_name == 'workflow_dispatch'
        run: |
          archive="$RUNNER_TEMP/trunk.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$TRUNK_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/benchup-trunk"
          tar -xzf "$archive" -C "$RUNNER_TEMP/benchup-trunk" trunk
          echo "$RUNNER_TEMP/benchup-trunk" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/benchup-trunk/trunk" --version

      - name: Build browser app
        if: github.event_name == 'workflow_dispatch'
        run: trunk build --release --locked --dist dist/site/play --public-url ./

      - name: Stage landing page and discovery files
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_stage_site.py'
          python3 scripts/stage_site.py --base-url "$PAGES_BASE_URL"
          test -f dist/site/index.html
          test -f dist/site/sitemap.xml
          test -f dist/site/llms.txt
          test -f dist/site/play/index.html
          test -n "$(find dist/site/play -name '*.wasm' -print -quit)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  deploy:
    name: Publish GitHub Pages
    needs: build
    if: github.event_name == 'workflow_run' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
