[workspace]
members = [
    "crates/benchup-core",
    "crates/benchup-io",
    "crates/benchup-skp",
    "crates/benchup-tools",
    "crates/benchup-cli",
    "crates/benchup-app",
]
default-members = ["crates/benchup-app"]
resolver = "2"

[workspace.package]
version = "0.7.1"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
glam = { version = "0.32", features = ["serde"] }

# Keep the development UI responsive without disabling debugger symbols,
# debug assertions, or overflow checks. Optimize third-party rendering/UI code
# more heavily than frequently edited application code.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Avoid mismatched anon.*.llvm.* symbols from reused app codegen units when
# linking WebAssembly after edits. Keep dependency caching and debug settings.
[profile.dev.package.benchup-app]
incremental = false

[profile.dev.package.benchup-core]
opt-level = 2

# Desktop edits can reuse application codegen units without the WebAssembly
# linker workaround above. Retain the same optimization and debug settings.
[profile.dev-desktop]
inherits = "dev"

[profile.dev-desktop.package.benchup-app]
incremental = true

[profile.release]
opt-level = 2
lto = "thin"

# Release-safety tests keep release assertions/overflow behavior, while avoiding
# whole-program LTO and expensive optimization of a second application binary.
[profile.ci-test]
inherits = "release"
opt-level = 1
lto = "off"
